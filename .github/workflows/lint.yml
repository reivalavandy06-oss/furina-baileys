name: Linting Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Restore Yarn Cache
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install packages
        run: node .yarn/releases/yarn-4.9.2.cjs install --immutable

      - name: Check linting
        run: node .yarn/releases/yarn-4.9.2.cjs run lint
